spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:db
    driver-class-name: org.h2.Driver
    username: db
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8082
