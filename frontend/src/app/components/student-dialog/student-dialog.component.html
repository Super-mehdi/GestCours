<h2 mat-dialog-title>{{ isEditMode ? 'Edit Student' : 'Add New Student' }}</h2>

<form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" placeholder="e.g. John" required>
      <mat-error *ngIf="studentForm.get('firstName')?.hasError('required')">
        First name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" placeholder="e.g. Doe" required>
      <mat-error *ngIf="studentForm.get('lastName')?.hasError('required')">
        Last name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email Address</mat-label>
      <input matInput type="email" formControlName="email" placeholder="e.g. john.doe@example.com" required>
      <mat-error *ngIf="studentForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="studentForm.get('email')?.hasError('email')">
        Please enter a valid email address
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="studentForm.invalid">
      {{ isEditMode ? 'Save Changes' : 'Add Student' }}
    </button>
  </mat-dialog-actions>
</form>
