<h2 mat-dialog-title>{{ isEditMode ? 'Edit Course' : 'Add New Course' }}</h2>

<form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Course Code</mat-label>
      <input matInput formControlName="code" placeholder="e.g. CS101" required>
      <mat-error *ngIf="courseForm.get('code')?.hasError('required')">
        Course code is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Course Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Introduction to Computer Science" required>
      <mat-error *ngIf="courseForm.get('name')?.hasError('required')">
        Course name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Capacity</mat-label>
      <input matInput type="number" formControlName="capacity" placeholder="e.g. 30" required>
      <mat-error *ngIf="courseForm.get('capacity')?.hasError('required')">
        Capacity is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Brief course overview..." required></textarea>
      <mat-error *ngIf="courseForm.get('description')?.hasError('required')">
        Description is required
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="courseForm.invalid">
      {{ isEditMode ? 'Save Changes' : 'Add Course' }}
    </button>
  </mat-dialog-actions>
</form>
